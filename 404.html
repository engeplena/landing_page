<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada (404) — Engeplena Engenharia</title>
    <meta name="description" content="A página que você procurava não foi encontrada. Volte para o início ou navegue pelos serviços da Engeplena Engenharia.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1D2820 0%, #2D3F2F 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            text-align: center;
        }
        .wrap { max-width: 560px; }
        .code {
            font-size: clamp(72px, 20vw, 128px);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #AACBC4 0%, #48887B 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        h1 {
            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: 600;
            margin: 16px 0 12px;
            line-height: 1.3;
        }
        p {
            color: #E0E0E0;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .btn-primary { background-color: #48887B; color: #ffffff; }
        .btn-primary:hover { background-color: #AACBC4; color: #2D3F2F; }
        .btn-ghost {
            background-color: transparent;
            color: #E0E0E0;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.24);
            margin-left: 12px;
        }
        .btn-ghost:hover { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .contact {
            margin-top: 32px;
            font-size: 14px;
            color: #999696;
        }
        .contact a { color: #AACBC4; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .actions { display: flex; flex-direction: column; gap: 12px; }
            .btn-ghost { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code" aria-hidden="true">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço que você acessou não existe ou foi movido. Use um dos atalhos abaixo para continuar navegando.</p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Voltar ao início</a>
            <a class="btn btn-ghost" href="/servicos/">Nossos serviços</a>
        </div>
        <p class="contact">
            Prefere falar com a gente?<br>
            <a href="tel:+553135613966">(31) 3561-3966</a> · <a href="https://wa.me/5531987950463" rel="noopener">WhatsApp</a>
        </p>
    </div>
</body>
</html>
